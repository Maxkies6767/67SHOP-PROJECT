<header class="top-header">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <div class="logo">
    <img src="../assets/images/best logo.png" alt="67SHOP">
    <span class="logo-text">67SHOP</span>
    <span class="logo-sub thai">Admin Panel</span>
  </div>

  <nav class="top-nav thai">
    <a href="./dashboard.html" class="nav-link" id="nav-dashboard"><i class="fas fa-chart-line"></i> Dashboard</a>
    <a href="./order.html" class="nav-link" id="nav-order"><i class="fas fa-plus"></i> สร้างออเดอร์</a>
    <a href="./kanban.html" class="nav-link" id="nav-kanban"><i class="fas fa-columns"></i> Kanban Board</a>
    <a href="./compare.html" class="nav-link" id="nav-compare"><i class="fas fa-search"></i> เปรียบเทียบราคา</a>
    <a href="./stats.html" class="nav-link" id="nav-stats" style="display:none;"><i class="fas fa-chart-bar"></i> สถิติ</a>
    <a href="./config.html" class="nav-link" id="nav-config" style="display:none;"><i class="fas fa-cog"></i> ตั้งค่า</a>
  </nav>

  <div class="user-info">
    <div class="user-badge thai" onclick="window.location.href='./profile.html'" style="cursor:pointer; gap:0.6rem; padding: 0.35rem 0.8rem 0.35rem 0.4rem;">
      <div style="position:relative; width:28px; height:28px;">
        <img id="headerUserAvatar" src="" alt="" class="user-avatar-img" style="width:100%; height:100%; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,0.2); background: var(--bg-deep);">
        <div style="position:absolute; bottom:-1px; right:-1px; width:10px; height:10px; background:#10b981; border:2px solid #111018; border-radius:50%;"></div>
      </div>
      <span id="headerUserName">-</span>
      <span class="role-tag" id="headerUserRole">-</span>
    </div>
    <button class="btn-logout thai" onclick="Store.clearSession(); window.location.href='../index.html';">ออกจากระบบ</button>
    <button class="mobile-toggle" id="mobileToggle">
      <i class="fas fa-bars"></i>
    </button>
  </div>
</header>

<!-- Mobile Navigation Overlay -->
<div class="mobile-nav-overlay" id="mobileNav">
  <div class="mobile-nav-header">
    <div class="logo">
      <img src="../assets/images/best logo.png" alt="67SHOP" style="height:40px;">
      <span class="logo-text" style="font-size:1.1rem;">67SHOP</span>
    </div>
    <button class="mobile-nav-close" id="mobileClose"><i class="fas fa-times"></i></button>
  </div>
  <div class="mobile-nav-links thai">
    <a href="./dashboard.html" class="mobile-nav-link" id="m-nav-dashboard"><i class="fas fa-chart-line"></i> Dashboard</a>
    <a href="./order.html" class="mobile-nav-link" id="m-nav-order"><i class="fas fa-plus"></i> สร้างออเดอร์</a>
    <a href="./kanban.html" class="mobile-nav-link" id="m-nav-kanban"><i class="fas fa-columns"></i> Kanban Board</a>
    <a href="./stats.html" class="mobile-nav-link" id="m-nav-stats" style="display:none;"><i class="fas fa-chart-bar"></i> สถิติ</a>
    <a href="./config.html" class="mobile-nav-link" id="m-nav-config" style="display:none;"><i class="fas fa-cog"></i> ตั้งค่า</a>
  </div>
  <div style="margin-top: auto; padding-top: 2rem;">
    <button class="btn-logout thai w-full" onclick="Store.clearSession(); window.location.href='../index.html';">ออกจากระบบ</button>
  </div>
</div>

<script>
  (function() {
    const s = JSON.parse(localStorage.getItem('shop67_session') || 'null');
    if (s) {
      document.getElementById('headerUserName').textContent = s.displayName || s.name;
      const avatarUrl = s.avatarUrl || `https://ui-avatars.com/api/?name=${s.name}&background=6D5BFF&color=fff`;
      document.getElementById('headerUserAvatar').src = avatarUrl;
      
      const tag = document.getElementById('headerUserRole');
      tag.textContent = s.role === 'owner' ? 'Owner' : 'Admin';
      if (s.role === 'owner') {
        tag.style.background = 'linear-gradient(180deg, #fbbf24, #d97706)';
        tag.style.border = '1px solid rgba(255,255,255,0.3)';
        tag.style.boxShadow = 'inset 0 1px 1px rgba(255,255,255,0.4), 0 2px 10px rgba(245,158,11,0.4)';
        tag.style.textShadow = '0 1px 2px rgba(0,0,0,0.1)';
        
        // Show owner links
        ['nav-stats', 'nav-config', 'm-nav-stats', 'm-nav-config'].forEach(id => {
          const el = document.getElementById(id);
          if(el) el.style.display = 'flex';
        });
      }
    }
    
    // Active state
    const page = window.location.pathname.split('/').pop().replace('.html', '');
    const map = { dashboard: 'nav-dashboard', order: 'nav-order', kanban: 'nav-kanban', stats: 'nav-stats', config: 'nav-config' };
    const m_map = { dashboard: 'm-nav-dashboard', order: 'm-nav-order', kanban: 'm-nav-kanban', stats: 'm-nav-stats', config: 'm-nav-config' };
    
    const el = document.getElementById(map[page]);
    if (el) el.classList.add('active');
    const mEl = document.getElementById(m_map[page]);
    if (mEl) mEl.classList.add('active');

    // Mobile menu toggle
    const toggle = document.getElementById('mobileToggle');
    const close = document.getElementById('mobileClose');
    const nav = document.getElementById('mobileNav');

    toggle.onclick = () => nav.classList.add('show');
    close.onclick = () => nav.classList.remove('show');
  })();
</script>
