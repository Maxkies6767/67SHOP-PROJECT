<script>
  (function() {
    const s = JSON.parse(localStorage.getItem('shop67_session') || 'null');
    if (s && s.role === 'owner') {
      document.getElementById('ownerSection').style.display = '';
      document.getElementById('nav-stats').style.display = '';
      document.getElementById('nav-config').style.display = '';
    }
    // Active state
    const page = window.location.pathname.split('/').pop().replace('.html', '');
    const map = { dashboard: 'nav-dashboard', order: 'nav-order', kanban: 'nav-kanban', stats: 'nav-stats', config: 'nav-config', profile: 'nav-profile' };
    const el = document.getElementById(map[page]);
    if (el) el.classList.add('active');
  })();
</script>
