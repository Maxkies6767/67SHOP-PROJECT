<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban — 67SHOP</title>
  <link rel="icon" href="../assets/images/best logo.png">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div id="headerSlot"></div>
  <div class="admin-wrap">
    <div id="sidebarSlot"></div>
    <main class="main-content">
      <h1 class="page-title"><i class="fas fa-layer-group" style="margin-right:.5rem; font-size:1.8rem; color:var(--primary);"></i> Kanban Board</h1>

      <div class="kanban-board" id="kanbanBoard">
        <div class="kanban-col" id="col-pending">
          <div class="kanban-col-title" style="color:var(--warning);"><i class="fas fa-hourglass-half" style="margin-right:.5rem;"></i> รอดำเนินการ <span class="count" id="cnt-pending">0</span></div>
          <div class="kanban-items" id="items-pending"></div>
        </div>
        <div class="kanban-col" id="col-processing">
          <div class="kanban-col-title" style="color:var(--info);"><i class="fas fa-spinner fa-spin" style="margin-right:.5rem;"></i> กำลังเติม <span class="count" id="cnt-processing">0</span></div>
          <div class="kanban-items" id="items-processing"></div>
        </div>
        <div class="kanban-col" id="col-completed">
          <div class="kanban-col-title" style="color:var(--secondary);"><i class="fas fa-check-circle" style="margin-right:.5rem;"></i> สำเร็จ <span class="count" id="cnt-completed">0</span></div>
          <div class="kanban-items" id="items-completed"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h3 class="thai mb-1" id="modalTitle" style="font-size:1.1rem;">ยืนยัน</h3>
      <p class="thai mb-2" id="modalMsg" style="color:var(--text-muted);">ต้องการดำเนินการนี้หรือไม่?</p>
      <div class="flex gap-1 justify-center">
        <button class="btn btn-danger thai" id="modalConfirm">ยืนยัน</button>
        <button class="btn btn-secondary thai" id="modalCancel">ยกเลิก</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/store.js"></script>
  <script src="../js/sound.js"></script>
  <script src="../js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Store.init();
      Store.requireAuth();
      await loadComponent('headerSlot', '../components/header.html');
      await loadComponent('sidebarSlot', '../components/sidebar.html');
      renderKanban();
      Store.subscribe(renderKanban);
    });

    function renderKanban() {
      const orders = Store.getOrders();
      ['pending', 'processing', 'completed'].forEach(status => {
        const items = orders.filter(o => o.status === status);
        document.getElementById('cnt-' + status).textContent = items.length;
        const container = document.getElementById('items-' + status);
        container.innerHTML = items.length === 0
          ? '<p class="thai" style="color:var(--text-muted);font-size:.8rem;padding:.5rem;">ว่าง</p>'
          : items.map(o => renderCard(o)).join('');
      });

      // Attach event listeners
      document.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', function() {
          const action = this.dataset.action;
          const oid = decodeURIComponent(this.dataset.oid || '');
          const uid = decodeURIComponent(this.dataset.uid || '');
          const link = decodeURIComponent(this.dataset.link || '');

          if (action === 'copygo') copyAndGo(oid, uid, link);
          else if (action === 'complete') completeOrder(oid);
          else if (action === 'delete') confirmDelete(oid);
        });
      });
    }

    function renderCard(o) {
      const profit = o.sellPrice - o.cost;
      let actions = '';

      if (o.status === 'pending') {
        actions = `
          <button class="btn btn-success btn-sm thai" data-action="copygo" data-oid="${encodeURIComponent(o.id)}" data-uid="${encodeURIComponent(o.uid)}" data-link="${encodeURIComponent(o.supplierLink || '')}">Copy UID</button>
          <button class="btn btn-danger btn-sm thai" data-action="delete" data-oid="${encodeURIComponent(o.id)}">ลบ</button>
        `;
      } else if (o.status === 'processing') {
        actions = `
          <button class="btn btn-success btn-sm thai" data-action="complete" data-oid="${encodeURIComponent(o.id)}">เสร็จสิ้น</button>
          <button class="btn btn-danger btn-sm thai" data-action="delete" data-oid="${encodeURIComponent(o.id)}">ลบ</button>
        `;
      }

      const timeStr = o.createdAt ? new Date(o.createdAt).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : '';
      const dateStr = o.createdAt ? new Date(o.createdAt).toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit'}) : '';

      return `
        <div class="kanban-item">
          <div class="flex justify-between items-start">
            <span class="order-id">${o.id}</span>
            <div style="text-align:right; line-height:1.2; opacity:0.8;">
              <div style="font-size:.7rem;color:var(--primary-light);font-weight:600;">${o.channel || ''}</div>
              <div style="font-size:.62rem;color:var(--text-dim);">${dateStr} ${timeStr}</div>
            </div>
          </div>
          <div class="order-game thai">${o.gameName} — ${o.pkgName}</div>
          <div style="margin: .4rem 0;">
            <span class="cell-uid" style="font-size: 0.9rem; cursor: pointer;" onclick="navigator.clipboard.writeText('${o.uid}')" title="คลิกเพื่อคัดลอก">${o.uid}</span>
          </div>
          <div style="font-size:.8rem;color:var(--text-muted); opacity:0.7;">Supplier: ${o.supplierName} (฿${o.cost})</div>
          <div class="flex justify-between items-center" style="margin-top:.8rem; border-top:1px solid rgba(255,255,255,0.06); padding-top:.6rem;">
            <div class="thai" style="margin-bottom:0;">
              <span style="font-size:0.85rem; font-weight:700; color:var(--secondary);">กำไร: ฿${profit.toLocaleString()}</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:.2rem; align-items:flex-end;" class="thai">
              <div class="staff-chip"><span>สร้าง:</span> ${o.createdBy || '-'}</div>
              ${o.acceptedBy ? `<div class="staff-chip accepted"><span>รับ:</span> ${o.acceptedBy}</div>` : ''}
              ${o.completedBy ? `<div class="staff-chip completed"><span>ปิด:</span> ${o.completedBy}</div>` : ''}
            </div>
          </div>
          <div class="order-actions">${actions}</div>
        </div>
      `;
    }

    async function copyAndGo(orderId, uid, link) {
      try {
        await navigator.clipboard.writeText(uid);
      } catch(e) {
        const ta = document.createElement('textarea');
        ta.value = uid; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      }
      await Store.updateOrderStatus(orderId, 'processing');
      SFX.play('success');
      renderKanban();
      if (link) window.open(link, '_blank');
    }

    async function completeOrder(id) {
      await Store.updateOrderStatus(id, 'completed');
      SFX.play('success');
      renderKanban();
    }

    function confirmDelete(id) {
      SFX.play('delete');
      showModal('🗑️ ลบออเดอร์', 'ต้องการลบออเดอร์ ' + id + ' จริงหรือไม่? การลบจะไม่สามารถกู้คืนได้', async () => {
        await Store.removeOrder(id);
        renderKanban();
      });
    }
  </script>
</body>
</html>
