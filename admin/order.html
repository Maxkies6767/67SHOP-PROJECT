<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สร้างออเดอร์ — 67SHOP</title>
  <link rel="icon" href="../assets/images/best logo.png">
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="headerSlot"></div>
  <div class="admin-wrap">
    <div id="sidebarSlot"></div>
    <main class="main-content" id="reactRoot"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/sound.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/TopupPopup.js"></script>
  
  <script>
    const { useState, useEffect } = React;

    const OrderApp = () => {
        const [isPopupOpen, setIsPopupOpen] = useState(false);
        const [selectedGame, setSelectedGame] = useState(null);
        const [packages, setPackages] = useState([]);
        const [games, setGames] = useState([]);
        const [channel, setChannel] = useState('LINE');

        useEffect(() => {
            const loadData = () => setGames(Store.getGames());
            loadData();
            Store.subscribe(loadData);
        }, []);

        const handleGameClick = (game) => {
            setSelectedGame(game);
            const gamePackages = Store.getPackagesByGame(game.id);
            setPackages(gamePackages);
            setIsPopupOpen(true);
        };

        return React.createElement(React.Fragment, null, [
            React.createElement('h1', { className: 'page-title text-white font-bold text-2xl mb-8 mt-4', key: 'title' }, [
                React.createElement('i', { className: 'fas fa-plus-circle rotating mr-2' }),
                ' สร้างออเดอร์ใหม่'
            ]),
            // 2. เลือกเกม
            React.createElement('div', { className: 'card mb-6 p-6', key: 'step2' }, [
                React.createElement('div', { className: 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 2xl:grid-cols-10 gap-4 md:gap-6 items-start' }, games.length === 0 ? 
                    React.createElement('div', { className: 'text-center col-span-full text-white/40' }, 'กำลังโหลดข้อมูลเกม...') :
                    games.map((game) => (
                    React.createElement('div', {
                        key: game.id,
                        onClick: () => handleGameClick(game),
                        className: `flex flex-col items-center justify-start cursor-pointer transition-all duration-300 hover:scale-105 h-full`
                    }, [
                        React.createElement('img', { src: game.icon, className: 'w-full max-w-[120px] aspect-square rounded-2xl object-cover mb-2' }),
                        React.createElement('div', { className: 'text-[13px] font-bold text-white/80 text-center leading-tight' }, game.name)
                    ])
                )))
            ]),

            // Popup Component
            React.createElement(TopupPopup, {
                key: 'popup',
                isOpen: isPopupOpen,
                onClose: () => setIsPopupOpen(false),
                game: selectedGame,
                packages: packages,
                onOrder: async (data) => {
                    // Save to database
                    const session = Store.getSession();
                    const orderData = await Store.addOrder({
                        channel: channel,
                        gameId: selectedGame.id,
                        pkgId: data.selectedPkg.id,
                        uid: data.uid,
                        sellPrice: data.totalPrice, // User can override total price via profit
                        cost: data.originalCost,
                        createdBy: session ? session.name : 'System'
                    });
                    
                    if (orderData) {
                        if (typeof SFX !== 'undefined') SFX.play('success');
                        setIsPopupOpen(false);
                        window.location.href = './kanban.html';
                    } else {
                        alert('เกิดข้อผิดพลาดในการสร้างออเดอร์ กรุณาลองใหม่');
                    }
                }
            })
        ]);
    };

    document.addEventListener('DOMContentLoaded', async () => {
        await Store.init();
        Store.requireAuth();
        await loadComponent('headerSlot', '../components/header.html');
        await loadComponent('sidebarSlot', '../components/sidebar.html');
        
        const root = ReactDOM.createRoot(document.getElementById('reactRoot'));
        root.render(React.createElement(OrderApp));
    });
  </script>
</body>
</html>
