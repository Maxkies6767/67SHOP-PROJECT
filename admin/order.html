<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สร้างออเดอร์ — 67SHOP</title>
  <link rel="icon" href="../assets/images/best logo.png">
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="headerSlot"></div>
  <div class="admin-wrap">
    <div id="sidebarSlot"></div>
    <main class="main-content" id="reactRoot"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/sound.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/TopupPopup.js"></script>
  
  <script>
    const { useState, useEffect } = React;

    const OrderApp = () => {
        const [isPopupOpen, setIsPopupOpen] = useState(false);
        const [selectedGame, setSelectedGame] = useState(null);
        const [packages, setPackages] = useState([]);
        const [games, setGames] = useState([]);
        const [channel, setChannel] = useState('LINE');

        useEffect(() => {
            const loadData = () => setGames(Store.getGames());
            loadData();
            Store.subscribe(loadData);
        }, []);

        const handleGameClick = (game) => {
            setSelectedGame(game);
            const gamePackages = Store.getPackagesByGame(game.id);
            setPackages(gamePackages);
            setIsPopupOpen(true);
        };

        return React.createElement(React.Fragment, null, [
            React.createElement('h1', { className: 'page-title text-white font-bold text-2xl mb-8 mt-4', key: 'title' }, [
                React.createElement('i', { className: 'fas fa-plus-circle rotating mr-2' }),
                ' สร้างออเดอร์ใหม่'
            ]),

            // 1. ช่องทางลูกค้า
            React.createElement('div', { className: 'card mb-6 p-6', key: 'step1' }, [
                React.createElement('h3', { className: 'text-center text-[12px] font-bold text-white/60 mb-4 uppercase' }, '1. ช่องทางลูกค้า'),
                React.createElement('div', { className: 'grid grid-cols-2 gap-4' }, [
                    React.createElement('button', { 
                        className: `btn-channel btn-line py-4 ${channel === 'LINE' ? 'active' : ''}`,
                        onClick: () => setChannel('LINE')
                    }, [React.createElement('i', { className: 'fab fa-line text-2xl mb-1' }), 'LINE']),
                    React.createElement('button', { 
                        className: `btn-channel btn-facebook py-4 ${channel === 'Facebook' ? 'active' : ''}`,
                        onClick: () => setChannel('Facebook')
                    }, [React.createElement('i', { className: 'fab fa-facebook text-2xl mb-1' }), 'Facebook'])
                ])
            ]),

            // 2. เลือกเกม
            React.createElement('div', { className: 'card mb-6 p-6', key: 'step2' }, [
                React.createElement('h3', { className: 'text-center text-[12px] font-bold text-white/60 mb-6 uppercase' }, '2. เลือกเกม'),
                React.createElement('div', { className: 'game-grid' }, games.length === 0 ? 
                    React.createElement('div', { className: 'text-center col-span-full text-white/40' }, 'กำลังโหลดข้อมูลเกม...') :
                    games.map((game) => (
                    React.createElement('div', {
                        key: game.id,
                        onClick: () => handleGameClick(game),
                        className: `game-card flex flex-col items-center justify-center cursor-pointer rounded-2xl border border-transparent hover:border-[#8b5cf6] transition-all duration-300 p-2`
                    }, [
                        React.createElement('img', { src: game.icon, className: 'w-16 h-16 rounded-2xl mb-2 object-cover border border-white/10' }),
                        React.createElement('div', { className: 'text-[11px] font-bold text-white/80 text-center leading-tight' }, game.name)
                    ])
                )))
            ]),

            // 3. เลือกแพ็กเกจ (Empty Background State)
            React.createElement('div', { className: 'card mb-6 p-6 min-h-[120px] flex items-center justify-center', key: 'step3' }, [
                React.createElement('h3', { className: 'text-[12px] font-bold text-white/60 uppercase m-0' }, '3. เลือกแพ็กเกจ')
            ]),

            // 4. สรุป & กรอก UID (Empty Background State)
            React.createElement('div', { className: 'card p-8 mb-10', key: 'step4' }, [
                React.createElement('h3', { className: 'text-center text-[12px] font-bold text-white/60 mb-6 uppercase' }, '4. สรุป & กรอก UID'),
                React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-8' }, [
                    React.createElement('div', { className: 'space-y-4' }, [
                        React.createElement('div', null, [
                            React.createElement('label', { className: 'form-label text-[11px]' }, 'UID ลูกค้า'),
                            React.createElement('input', { className: 'form-input bg-black/40', disabled: true, placeholder: 'กรอก UID ลูกค้า' })
                        ]),
                        React.createElement('div', null, [
                            React.createElement('label', { className: 'form-label text-[11px]' }, 'ราคาขาย (บาท)'),
                            React.createElement('input', { className: 'form-input bg-black/40', disabled: true })
                        ])
                    ]),
                    React.createElement('div', { className: 'bg-black/20 border border-white/5 rounded-xl p-6 text-[12px]' }, [
                        React.createElement('div', { className: 'text-white/60 font-bold mb-1' }, 'Supplier ถูกสุด (อัตโนมัติ)'),
                        React.createElement('div', { className: 'text-white/40 mb-4' }, '-'),
                        React.createElement('div', { className: 'flex items-center gap-2 mb-2' }, [React.createElement('span', { className: 'text-white/40' }, 'ต้นทุน:'), React.createElement('span', { className: 'text-[#f59e0b] font-bold' }, '-')]),
                        React.createElement('div', { className: 'flex items-center gap-2' }, [React.createElement('span', { className: 'text-white/40' }, 'กำไร:'), React.createElement('span', { className: 'text-[#10b981] font-bold' }, '-')])
                    ])
                ]),
                React.createElement('button', { className: 'btn btn-success w-full py-4 mt-8 text-lg font-bold opacity-80 cursor-not-allowed' }, 'Order 67')
            ]),

            // Popup Component
            React.createElement(TopupPopup, {
                key: 'popup',
                isOpen: isPopupOpen,
                onClose: () => setIsPopupOpen(false),
                game: selectedGame,
                packages: packages,
                onOrder: async (data) => {
                    // Save to database
                    const session = Store.getSession();
                    const orderData = await Store.addOrder({
                        channel: channel,
                        gameId: selectedGame.id,
                        pkgId: data.selectedPkg.id,
                        uid: data.uid,
                        sellPrice: data.totalPrice, // User can override total price via profit
                        cost: data.originalCost,
                        createdBy: session ? session.name : 'System'
                    });
                    
                    if (orderData) {
                        if (typeof SFX !== 'undefined') SFX.play('success');
                        setIsPopupOpen(false);
                        window.location.href = './kanban.html';
                    } else {
                        alert('เกิดข้อผิดพลาดในการสร้างออเดอร์ กรุณาลองใหม่');
                    }
                }
            })
        ]);
    };

    document.addEventListener('DOMContentLoaded', async () => {
        await Store.init();
        Store.requireAuth();
        await loadComponent('headerSlot', '../components/header.html');
        await loadComponent('sidebarSlot', '../components/sidebar.html');
        
        const root = ReactDOM.createRoot(document.getElementById('reactRoot'));
        root.render(React.createElement(OrderApp));
    });
  </script>
</body>
</html>
