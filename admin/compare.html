<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เปรียบเทียบราคา — 67SHOP</title>
  <link rel="icon" href="../assets/images/best logo.png">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .search-hero {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 3rem 2rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 2.5rem;
      background-image: radial-gradient(circle at top right, rgba(108, 92, 231, 0.15), transparent 400px);
    }
    .search-input-group {
      position: relative;
      max-width: 700px;
      margin: 1.5rem auto 0;
    }
    .search-input-group i {
      position: absolute;
      left: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--secondary);
      font-size: 1.2rem;
    }
    .main-search {
      width: 100%;
      padding: 1.2rem 1.5rem 1.2rem 3.5rem;
      background: var(--bg-deep);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      color: white;
      font-size: 1.1rem;
      transition: all 0.3s;
    }
    .main-search:focus { border-color: var(--secondary); outline: none; box-shadow: 0 0 20px rgba(108, 92, 231, 0.3); }
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .p-card {
      background: var(--bg-card);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1.5rem;
      position: relative;
      animation: fadeIn 0.4s ease forwards;
    }
    .best-deal-badge {
      position: absolute;
      top: 0; right: 0;
      background: var(--success); color: #000;
      padding: 0.3rem 1rem; font-size: 0.7rem; font-weight: 900;
      border-bottom-left-radius: 12px;
    }
    .p-price { font-size: 1.6rem; font-weight: 900; color: var(--accent); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="headerSlot"></div>
  <div class="admin-wrap">
    <div id="sidebarSlot"></div>
    <main class="main-content">
      
      <div class="search-hero">
        <h1 class="hero-title thai">💰 ระบบเปรียบเทียบราคาอัจฉริยะ (V2.1)</h1>
        <p class="thai" style="color:var(--text-muted); opacity: 0.8;">ค้นหาแพ็กเกจที่คุ้มที่สุดจาก 21 ซัพพลายเออร์ทันที</p>
        
        <div class="search-input-group">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" class="main-search thai" placeholder="ค้นหาเกม หรือจำนวนที่ต้องการ... (เช่น rov 1000)" autocomplete="off">
        </div>
      </div>

      <div class="flex justify-between items-center mb-1.5 px-1">
        <h2 class="thai" style="font-size: 1.1rem; font-weight: 700;"><i class="fas fa-list-ul"></i> รายการที่พบ</h2>
        <div id="resultCount" class="thai" style="color: var(--secondary); font-weight: 700;">กำลังค้นหา...</div>
      </div>

      <div class="compare-grid" id="resultGrid"></div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/components.js"></script>
  <script>
    const SUPPLIERS = ["Codashop", "Midasbuy", "LnwTrue", "P2W TOPUP", "SEAGM", "Easycard", "Itemmania", "OverTopup", "INDEX Game", "GameGeek", "Gaming Nation", "Richman Shop", "WonDD", "Termgame", "LapakGaming", "Termcodegame", "TrueMoney", "WePAY", "Junebikoshop", "MT Topup", "Clever Pay"];
    const DATA_POOL = [];

    // 1. Initialize data IMMEDIATELY
    (function initData() {
      const catalogs = [
        { game: "Garena ROV", short: "rov", items: [{ val: 100, p: 95 }, { val: 500, p: 470 }, { val: 1000, p: 920 }], unit: "Coupons" },
        { game: "Free Fire", short: "ff", items: [{ val: 100, p: 35 }, { val: 500, p: 165 }, { val: 1000, p: 310 }], unit: "Diamonds" }
      ];
      catalogs.forEach(cat => {
        cat.items.forEach(item => {
          SUPPLIERS.forEach(sup => {
            const price = Math.floor(item.p * (0.95 + Math.random() * 0.1));
            const bonus = Math.floor(Math.random() * 50);
            DATA_POOL.push({
              supplier: sup, game: cat.game, short: cat.short,
              name: `${cat.game} ${item.val + bonus} ${cat.unit}`,
              price: price, bonus: bonus
            });
          });
        });
      });
    })();

    let fuse = null;
    function setupSearch() {
      if (typeof Fuse !== 'undefined') {
        fuse = new Fuse(DATA_POOL, { keys: ['name', 'game', 'short', 'supplier'], threshold: 0.4 });
      }
      handleSearch("rov"); // Initial search
    }

    function handleSearch(q) {
      const grid = document.getElementById('resultGrid');
      const countEl = document.getElementById('resultCount');
      
      let res = [];
      if (fuse && q) {
        res = fuse.search(q).map(r => r.item);
      } else if (q) {
        res = DATA_POOL.filter(i => i.name.toLowerCase().includes(q.toLowerCase()));
      } else {
        res = DATA_POOL.slice(0, 12);
      }

      res.sort((a,b) => a.price - b.price);
      countEl.textContent = `พบ ${res.length} รายการ`;
      
      grid.innerHTML = res.map((item, idx) => `
        <div class="p-card">
          ${idx === 0 ? '<div class="best-deal-badge thai">คุ้มที่สุด</div>' : ''}
          <span style="font-size:0.6rem; color:var(--secondary); font-weight:800;">${item.supplier}</span>
          <div class="thai" style="font-weight:700; margin:0.3rem 0;">${item.name}</div>
          <div class="flex justify-between items-center mt-1">
            <div class="p-price">฿${item.price}</div>
            <button class="btn btn-primary btn-sm thai" onclick="alert('ไปยังหน้าชำระเงิน...')">สั่งซื้อ</button>
          </div>
        </div>
      `).join('');
    }

    // 2. Start UI and Search in PARALLEL
    window.addEventListener('load', () => {
      // Background Tasks
      loadComponent('headerSlot', '../components/header.html');
      loadComponent('sidebarSlot', '../components/sidebar.html');
      
      // Immediate Search Setup
      setupSearch();

      document.getElementById('searchInput').addEventListener('input', (e) => handleSearch(e.target.value));
    });

    // Fallback if load is too slow
    setTimeout(() => { if(!fuse) setupSearch(); }, 1000);
  </script>
</body>
</html>
