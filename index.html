<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — 67SHOP</title>
  <link rel="icon" href="assets/images/best logo.png">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .login-logo{width:144px;height:auto;margin:0 auto 1.5rem;filter:drop-shadow(0 0 20px var(--primary-glow));transition:transform .4s ease}
    .login-logo:hover{transform:scale(1.08) rotate(2deg)}
    .login-title{font-size:1.8rem;font-weight:900;text-align:center;margin-bottom:.3rem;background:linear-gradient(135deg,#c4b5fd,var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .login-sub{text-align:center;color:var(--text-muted);font-size:.88rem;margin-bottom:2rem}
    .login-input{width:100%;padding:.85rem 1.2rem;background:rgba(8,8,20,.8);border:2px solid rgba(139,92,246,.12);border-radius:12px;color:var(--text);font-size:1rem;outline:none;transition:all .3s;font-family:'Kanit',sans-serif;text-align:center;letter-spacing:3px}
    .login-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(139,92,246,.12),0 0 30px rgba(139,92,246,.1)}
    .login-input::placeholder{letter-spacing:0;color:var(--text-dim)}
    .login-btn{width:100%;padding:.85rem;margin-top:1rem;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),#7c3aed,var(--primary-deep));background-size:200% auto;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:all .3s;box-shadow:0 6px 25px rgba(139,92,246,.35);font-family:'Kanit',sans-serif}
    .login-btn:hover{background-position:right center;box-shadow:0 8px 40px rgba(139,92,246,.5);transform:translateY(-2px)}
    .login-btn:active{transform:scale(.97)}
    .login-error{color:var(--danger);font-size:.82rem;text-align:center;margin-top:.8rem;min-height:1.2em}
  </style>
</head>
<body>
  <div class="page-login">
    <div class="login-box">
      <img src="assets/images/best logo.png" alt="67SHOP" class="login-logo">
      <div class="login-title">67SHOP</div>
      <p class="login-sub thai">ระบบจัดการเติมเกม — เข้าสู่ระบบ</p>
      <form id="loginForm" autocomplete="off">
        <div style="margin-bottom:.4rem;font-size:.82rem;color:var(--text-muted);" class="thai">🔑 รหัสผ่าน</div>
        <input type="password" id="inputPassword" class="login-input" placeholder="••••" autofocus required>
        <button type="submit" class="login-btn thai">เข้าสู่ระบบ</button>
        <div class="login-error thai" id="errorMsg"></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const btn = form.querySelector('button');
    const errorMsg = document.getElementById('errorMsg');

    // 1. Attach listener immediately to prevent reloads
    form.addEventListener('submit', async e => {
      e.preventDefault();
      
      const pw = document.getElementById('inputPassword').value.trim();
      
      // Wait for store if not ready
      if (!Store.isReady) {
        errorMsg.textContent = '⏳ กำลังเชื่อมต่อฐานข้อมูล...';
        return;
      }

      const user = Auth.attemptByPassword(pw);
      if (user) {
        window.location.href = 'admin/dashboard.html';
      } else {
        errorMsg.textContent = '❌ รหัสผ่านไม่ถูกต้อง';
        document.getElementById('inputPassword').style.borderColor = 'var(--danger)';
        setTimeout(() => {
          document.getElementById('inputPassword').style.borderColor = '';
          errorMsg.textContent = '';
        }, 2500);
      }
    });

    // 2. Initialize Store
    (async function() {
      btn.disabled = true;
      btn.textContent = 'กำลังโหลด...';
      
      try {
        await Store.init();
        Store.isReady = true;
        if (Store.getSession()) window.location.href = 'admin/dashboard.html';
      } catch (err) {
        errorMsg.textContent = '❌ เชื่อมต่อล้มเหลว กรุณารีเฟรชหน้าเว็บ';
      } finally {
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
      }
    })();
  </script>
</body>
</html>
